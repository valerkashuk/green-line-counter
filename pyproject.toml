[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green-line-counter"
version = "0.1.0"
description = "CLI tool to count horizontal green lines in PDF documents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "valerkashuk", email = "valerkashuk@users.noreply.github.com" }]
dependencies = [
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/valerkashuk/green-line-counter"
Repository = "https://github.com/valerkashuk/green-line-counter"
Issues = "https://github.com/valerkashuk/green-line-counter/issues"

[project.scripts]
green-line-counter = "green_line_counter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]